[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expreval"
version = "0.1.0"
description = "A safe arithmetic expression evaluator for Python: shunting-yard parsing, functions, constants and variables, no eval()."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdul Raheem" }]
requires-python = ">=3.10"
keywords = ["expression", "evaluator", "calculator", "shunting-yard", "parser", "math"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
expreval = "expreval.cli:main"

[project.urls]
Homepage = "https://github.com/BoogeyCodes/expreval"
Issues = "https://github.com/BoogeyCodes/expreval/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 115
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
